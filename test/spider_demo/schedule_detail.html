	<script language="javascript">
			//在线帮助文件
			var _MyHelpfile = "";
			var sNewProcess = ""; //判断是否审批
			var ISPROCESSPASS = "0"
			
            //代码重构 by 朱鹏飞 2012-02-22
			window.onload = function()
			{
			    if (document.getElementById("__ProcessPass"))
			    {
			        ISPROCESSPASS = __ProcessPass.value
			    }
			    //处理发起审批
			    HTFKPlan_Schedule_Edit.SetNewProcess();
			    //设置UI
			    HTFKPlan_Schedule_Edit.SetUI();
			}
			var HTFKPlan_Schedule_Edit =
			{
				/******************************************************************************************************
				控制页面显示
				******************************************************************************************************/
				SetUI: function() {
					if (__mode.value == "2") {
						if (appForm.ApproveState.getValue() == "审核中" || appForm.ApproveState.getValue() == "已审核") {
							//一级页面点击审批通过进入
							if (ISPROCESSPASS == "1" && appForm.ApproveState.getValue() == "审核中") {
								document.title = "修改应付进度款"
							}
							else {
								document.title = "查看应付进度款"
							}
						}
						else {
							document.title = "修改应付进度款"
						}
					}
					//显示公式信息，tip提示以及小图标
					this.SetTipInfo();
					//设置币种，若外币则需要显示人民币的字段
					this.SetBz();
					//根据不同场景，控制侧边栏的显示
					this.SetNavBarShow();
					//展示菜单
					this.SetMenuShow();
					//控制字段显示
					this.SetFieldShow();
					//设置默认值
					this.SetDefault();
					// 计算应付进度款
					this.CalScheduleAmount();
					//设置帮助文档
					this.SetHelpDoc();
					appForm._bAlert = false;
				},
				//显示公式信息，tip提示以及小图标
				SetTipInfo: function() {
					var sHTML = "<IMG id='img1' alt='' src='/Cbgl/Images/exp.gif' onmouseover='HTFKPlan_Schedule_Edit.ShowGs(true)' onmouseout='HTFKPlan_Schedule_Edit.ShowGs(false)' style='CURSOR: help; POSITION: static'>";
					var objAddCell = appForm_tabs.parentElement.parentElement.parentElement.parentElement.parentElement.insertCell(1);
					objAddCell.align = "right";
					objAddCell.widht = 15;
					objAddCell.insertAdjacentHTML("BeforeEnd", sHTML);
					appForm_tabs.parentElement.parentElement.parentElement.parentElement.parentElement.nextSibling.cells[0].colSpan = 2;
					sHTML = "";
					if (document.getElementById("txtEnableHTScheduleSP").value == "0" && appForm.ApproveState.getValue() != "未审核") {
						sHTML = "&nbsp;应付进度款&nbsp;&nbsp;&nbsp;= 审定金额 - 甲供材料款 - 其它扣款<br />";
						sHTML += "&nbsp;应付进度参考 = 审定金额 × 进度款支付比例 - 其它扣款 - 甲供材料款";
					} else {
						if (appForm.ApproveAmount.getValue() != 0) {
							sHTML = "&nbsp;应付进度款&nbsp;&nbsp;&nbsp;= 审定金额 - 甲供材料款 - 其它扣款<br />";
							sHTML += "&nbsp;应付进度参考 = 审定金额 × 进度款支付比例 - 其它扣款 - 甲供材料款";
						} else {
							sHTML = "&nbsp;应付进度款&nbsp;&nbsp;&nbsp;= 上报金额 - 甲供材料款 - 其它扣款<br />";
							sHTML += "&nbsp;应付进度参考 = 上报金额 × 进度款支付比例 - 其它扣款 - 甲供材料款";
						}
					}
					document.getElementById("spTipInfo").innerHTML = sHTML;
				},
				//设置币种的显示，若外币则需要显示人民币的字段
				SetBz: function() {
					if (appForm.appForm_CurrencyName.getValue() != "人民币") {
						//隐藏币种区域
						Section11.style.display = "";
						//显示应付进度款人民币字段
						HideShowElement("ScheduleAmount", "text", "block");
					}
					else {
						//隐藏上报金额、应付进度款人民币字段
						HideShowElement("ApplyAmount", "text", "none");
						HideShowElement("ScheduleAmount", "text", "none");
					}
				},
				//根据不同场景，控制侧边栏的显示
				SetNavBarShow: function() {
					appNavBar.showTab(1);
					//工程类合同，显示工程量清单标签页，其它类合同，不显示工程量清单
					if (appForm.appForm_HtKind.getValue() == "工程类") {
						appNavBar.showTab(2);
					}
					else {
						appNavBar.hiddenTab(2);
					}
					// 结算后增加增加应付进度款不显示扣款明细列表。。
					// 结算前增加的应付进度款可以查看扣款明细列表，但不能新增修改。。
					if (Form1.txtJsState.value == "结算" && appForm.appForm_IfBalanceUsed.getValue() != "1") {
						appNavBar.hiddenTab(1);
		            }
		            appNavBar.showTab(3);
				},
				//展示菜单
				SetMenuShow: function() {
					var bIsEnableSp = document.getElementById("txtEnableHTScheduleSP").value;
					if (appForm.ApproveState.getValue() == "未审核") {
						if (bIsEnableSp != 1) {
							reDisplay("scSave,scSaveAndClose,scTjApprove");
						} else {
							reDisplay("scSave,scSaveAndClose,mNewProcess");
						}
					} else if (appForm.ApproveState.getValue() == "审核中") {
						if (bIsEnableSp != 1) {
							reDisplay("scTgApprove,scBhApprove");
						} else {
							reDisplay("scOpenProcess");
						}
						//审批通过进入时隐藏审批驳回按钮
						if (ISPROCESSPASS == "1") {
							deDisplay("scBhApprove")
						}
					} else {
						if (bIsEnableSp == 1) {
							reDisplay("scOpenProcess");
						} else {
							reDisplay("scBhApprove");
						}
					}
					reDisplay("mnHttz");
					if (typeof (__viewtype) != "undefined" && __viewtype.value == "workflow") {
						if (__mode.value == 2) {
							reDisplay("scSave,scSaveAndClose");
							deDisplay("scTjApprove,scBhApprove,mNewProcess,scOpenProcess");
						} else {
							deDisplay("scSave,scSaveAndClose,scTjApprove,scTgApprove,scBhApprove,mNewProcess,scOpenProcess");
						}
					}
					//若被结算使用，则只允许查看
					if (appForm.appForm_IfBalanceUsed.value == 1) {
						deDisplay("scSave,scSaveAndClose,scTjApprove,scTgApprove,scBhApprove,mNewProcess,scOpenProcess");
					}
				},
				//控制字段显示
				SetFieldShow: function() {
					//非未审核时，字段不可编辑
					if (__mode.value == "2" && ((appForm.ApproveState.getValue() != "未审核" && typeof (__viewtype) == "undefined") || appForm.appForm_IfBalanceUsed.value == 1)) {
						var option_one;
						var option_two
						if (document.getElementById("txtEnableHTScheduleSP").value == "0" && appForm.ApproveState.getValue() == "审核中") {
							//如果审核状态为审核中且未启用工作流
							option_one = true
						}
						if (ISPROCESSPASS == "1") {    //审批通过进入
							option_two = true
						}
						if (option_one && option_one) {
							appForm.ApplyAmount_Bz.setReadOnly(true);
							appForm.ApplyDate.setReadOnly(true);
							appForm.ApplyAmount.setReadOnly(true);
							appForm.Applicant.setReadOnly(true);
							appForm.PerformRemarks.setReadOnly(true);
							appForm.RefHtTerms.setReadOnly(true)
							appForm.ApproveDate.setReadOnly(true);
							appForm.ApproveAmount.setReadOnly(false);
							appForm.ApprovedBy.setReadOnly(true);
							appForm.ItemAmount.setReadOnly(false);
							appForm.PayPercent.setReadOnly(false);
							appForm.Budgeteer.setReadOnly(true);
							appForm.BudgetDocNo.setReadOnly(true);
							appForm.ApproveDocNo.setReadOnly(true);
							SetControlReq(appForm.ApproveAmount, true);
							//只有其他扣款列表可以编辑
							appNavBar.children[1].outerHTML = appNavBar.children[1].outerHTML.replace(/__mode.value/g, "2")
							appNavBar.children[2].outerHTML = appNavBar.children[2].outerHTML.replace(/__mode.value/g, "2")
							appNavBar.children[3].outerHTML = appNavBar.children[3].outerHTML.replace(/__mode.value/g, "2")
						}
						else {
							// 上报信息不可编辑
							appForm.ApplyAmount_Bz.setReadOnly(true);
							appForm.ApplyDate.setReadOnly(true);
							appForm.ApplyAmount.setReadOnly(true);
							appForm.Applicant.setReadOnly(true);
							appForm.PerformRemarks.setReadOnly(true);
							appForm.RefHtTerms.setReadOnly(true)
							appForm.ApproveDate.setReadOnly(true);
							appForm.ApproveAmount.setReadOnly(true);
							appForm.ApprovedBy.setReadOnly(true);
							appForm.ItemAmount.setReadOnly(true);
							appForm.PayPercent.setReadOnly(true);
							appForm.Budgeteer.setReadOnly(true);
							appForm.BudgetDocNo.setReadOnly(true);
							appForm.ApproveDocNo.setReadOnly(true);
							appForm.Rate.setReadOnly(true);
							//debugger;
							appNavBar.innerHTML = appNavBar.innerHTML.replace(/__mode.value/g, "3")
						}
					}
					if (appForm.ApproveState.getValue() == "已审核") {
						appForm.Rate.setReadOnly(true);
					}
					// 设置其它扣款的值
					var fOtherDeduct = Form1.txtDeductAmount.value == "" ? "0.00" : Form1.txtDeductAmount.value;
					appForm.OtherDeduct.setValue(fOtherDeduct);
				},
				//设置帮助文档
				SetHelpDoc: function() {
					if (appForm.ApproveState.getValue() == "已审核") {
						_MyHelpfile = "/Cbgl/HELP/topics/合同执行人员/应付进度款/应付进度款审定.html";
					} else {
						_MyHelpfile = "/Cbgl/HELP/topics/合同执行人员/应付进度款.html";
					}
				},
				//显示公式
				ShowGs: function(bShow) {
					if (!spTipInfo) return;
					if (bShow) {
						var x = event.clientX;
						var y = event.clientY;
						spTipInfo.style.left = x - 420;
						spTipInfo.style.top = y;
						spTipInfo.style.display = "";
					}
					else spTipInfo.style.display = "none";
					document.getElementsByTagName("hr")[1].style.display = "none";
				},
				/*************************************************************************************************************************
				联动计算类
				*************************************************************************************************************************/
				//修改审定金额、甲供材料款、增加扣款明细时重算应付进度款： 应付进度款 = 审定金额－甲供材料款－其它扣款
				CalScheduleAmount: function() {
					var decApproveAmount;
					if (document.getElementById("txtEnableHTScheduleSP").value == "0" && appForm.ApproveState.getValue() != "未审核") {
						//2、当应付进度款为已审核时或者审核中且未启用工作流
						decApproveAmount = stringToFloat(appForm.ApproveAmount.getValue());
					} else {
						if (appForm.ApproveAmount.getValue() != 0) {
							decApproveAmount = stringToFloat(appForm.ApproveAmount.getValue());
						} else {
							decApproveAmount = stringToFloat(appForm.ApplyAmount_Bz.getValue());
						}
					}
					var decRate = stringToFloat(appForm.Rate.getValue());
					var decItemAmount = stringToFloat(appForm.ItemAmount.getValue());
					var decOtherDeduct = stringToFloat(appForm.OtherDeduct.getValue());
					var decScheduleAmount_Bz = formatFloat(calcDoubleFix(calcDoubleFix(decApproveAmount, decItemAmount, '-'), decOtherDeduct, '-'), 2);
					var decPayPercent = calcDoubleFix(stringToFloat(appForm.PayPercent.getValue()), 100, '/');
					appForm.ScheduleAmount_Bz.setValue(decScheduleAmount_Bz);
					appForm.ScheduleAmount.setValue(formatFloat(calcDoubleFix(decScheduleAmount_Bz, decRate, '*'), 2));
					appForm.ScheduleConsult.setValue(formatFloat(calcDoubleFix(calcDoubleFix(calcDoubleFix(decApproveAmount, decPayPercent, '*'), decOtherDeduct, '-'), decItemAmount, '-'), 2));
				},
				//更改汇率
				ChgRate: function() {
					var decRate = stringToFloat(appForm.Rate.getValue());
					var decApplyAmount_Bz = stringToFloat(appForm.ApplyAmount_Bz.getValue());
					var decScheduleAmount_Bz = stringToFloat(appForm.ScheduleAmount_Bz.getValue());
					appForm.ApplyAmount.setValue(formatFloat(calcDoubleFix(decRate, decApplyAmount_Bz, '*'), 2));
					appForm.ScheduleAmount.setValue(formatFloat(calcDoubleFix(decRate, decScheduleAmount_Bz, '*'), 2));
					this.CalScheduleAmount();
				},
				//更改上报金额
				ChgApplyAmount: function() {
					var decRate = stringToFloat(appForm.Rate.getValue());
					var decApplyAmount_Bz = stringToFloat(appForm.ApplyAmount_Bz.getValue());
					appForm.ApplyAmount.setValue(formatFloat(calcDoubleFix(decRate, decApplyAmount_Bz, '*'), 2));
					this.CalScheduleAmount();
				},
				//控制工作流的发起于线下提交审批
				SetNewProcess: function() {
					if (document.all("__IsNewProcess")) {
						var oid = appForm.oid.value;
						var type = document.all("__IsNewProcess").value == "2" ? "提交审批" : "发起审批";
						if (type == "提交审批") {
							//提交审批
							if (this.ValidProcess("提交审批")) {
								if (!this.DoProcess("提交审批")) {
									event.returnValue = false;
									return false;
								}
							}
							//刷新本页面
							var sCurrURL = location.href.substring(0, location.href.indexOf("?"));
							var arrURLParams = decodeURIComponent(location.href).substr(decodeURIComponent(location.href).indexOf("?") + 1).split("&");
							// 以修改方式重定向该页面
							var sNewURL = sCurrURL + "?mode=2&oid=" + myEscape(oid);
							for (var i = 0; i < arrURLParams.length; i++) {
								if (arrURLParams[i].toLowerCase().indexOf("mode=") != 0 && arrURLParams[i].toLowerCase().indexOf("oid=") != 0
								     && arrURLParams[i].toLowerCase().indexOf("isnewprocess=") < 0)
									sNewURL += "&" + arrURLParams[i];
							}
							window.navigate(escapeUrl(sNewURL));
							// 禁用“数据改变后关闭界面时给出提示信息”的功能
							appForm._bAlert = false;
							event.returnValue = false;
							//刷新本页以及父级窗体
							afterWorkflow();
							return false;
						} else {
							//发起审批校验
							if (!this.ValidProcess("发起审批")) {
								return false;
							}
							initiateBusinessProcess(appForm.oid.value, '应付进度款审批', true, "", "", "", "", "应付进度款")
						}
					}
				},
				//审批过程
				doOpenProcess: function() {
					//得到当前合同的工作流
					var sFile = "/Cbgl/HTFK/HTFK_XMLHTTP.aspx?oid=" + appForm.oid.value;
					var sRtnProcess = openXMLHTTP(sFile, "GetProcessGUIDBySchedule");
					if (sRtnProcess == "") {
						alert("当前记录未发起审批流程！");
						return;
					}
					//审批状态的校验
					if (!this.ValidProcess("审批过程")) {
						return;
					}
					//调用工作流公用函数打开审批流程窗口			
					openBuisinessProcess(sRtnProcess);
				},
				//审批通过
				DoProcessPass: function() {
					if (this.ValidProcess("审批通过")) {
						//金额变动,不能直接审批通过,需要先驳回在审批
						this.DoProcessPassForChgAmount();
					}
				},
				//审批驳回
				DoProcessIgnore: function() {
					if (this.ValidProcess("审批驳回")) {
						this.DoProcess("审批驳回");
					}
				},
				//审批相关操作前校验
				ValidProcess: function(tag) {
					//审批通过时校验
					if (tag == "审批通过") {
						if (!appForm.IsValid()) {
							return false;
						}
						//审定金额不允许为0
						if (appForm.ApproveAmount.getValue() == "0.00") {
							alert("审定金额不允许为0！")
							return false;
						}
					}
					var strFile = "/Cbgl/HTFK/HTFK_XMLHTTP.aspx?oid=" + appForm.oid.value + "&flag=" + myEscape(tag);
					//审批通过场景，需要传递审定金额
					if (tag == "审批通过") {
						strFile += "&approveAmount=" + myEscape(appForm.ApproveAmount.getValue());
					}

					var strRtn = openXMLHTTP(strFile, "ValidScheduleProcess");
					if (strRtn == "OK") { return true; } else {
						alert(strRtn.split("|")[0]);
						return false;
					}
				},
				//审批操作
				DoProcess: function(tag) {
					var strFile = "/Cbgl/HTFK/HTFK_XMLHTTP.aspx?oid=" + appForm.oid.value + "&flag=" + myEscape(tag);
					var strRtn = openXMLHTTP(strFile, "ScheduleDoProcess");
					if (strRtn == "True") {
						afterWorkflow();
						return true;
					} else {
						alert("操作失败，请关闭重试！");
						return false;
					}
				},
				//获取审批状态
				GetSpState: function() {
					var strFile = "/Cbgl/HTFK/HTFK_XMLHTTP.aspx?oid=" + appForm.oid.value;
					var strRtn = openXMLHTTP(strFile, "GetScheduleSpState");
					if (strRtn == "") { return "未审核"; }
					return strRtn;
				},
				SetNavigate: function(strMode) {
					//重新刷新页面
					var sCurrURL = location.href.substring(0, location.href.indexOf("?"));
					var arrURLParams = decodeURIComponent(location.href).substr(decodeURIComponent(location.href).indexOf("?") + 1).split("&");
					// 以修改方式重定向该页面
					var sNewURL = sCurrURL + "?mode=" + strMode + "&oid=" + myEscape(appForm.oid.value);
					for (var i = 0; i < arrURLParams.length; i++) {
						if (arrURLParams[i].toLowerCase().indexOf("mode=") != 0 && arrURLParams[i].toLowerCase().indexOf("oid=") != 0

			//************** 保存操作 **************//
			//功能：保存前，校验、收集数据

			function oprBeforeSave() {

			        event.returnValue = false;

			    try {

			            scheduleConccurency.release();
			        }

			function oprAfterSave()
			{
			    scheduleConccurency.release();
				var xmlDom = new ActiveXObject("Microsoft.XMLDOM")
				try
				{
				    xmlDom.loadXML(appForm.returnxml);
				    if (sNewProcess != "1" && sNewProcess != "2")
				    {
				        if (confirm("是否同步调整付款计划？"))
				        {
				            var sPath, strContractGUID;
				            strContractGUID = appForm.ContractGUID.getValue();
				            sPath = "/CBGL/HTFK/HTFKPlan_PayPlan_Edit.aspx?mode=2&oid=" + strContractGUID + "&OpenSource=ScheduleRef";
				            openMyWin(sPath)
				        }
				    }
				    if (xmlDom.documentElement.attributes.getNamedItem("result").value == "true") {
				        sOid = xmlDom.documentElement.attributes.getNamedItem("keyvalue").value
				        if (sNewProcess == "1" || sNewProcess == "2") {
				            //提交审批或发起审批，直接更改页面URL，然后在PageLoad里面执行发起操作
				            var sCurrURL = location.href.substring(0, location.href.indexOf("?"));
				            var arrURLParams = decodeURIComponent(location.href).substr(decodeURIComponent(location.href).indexOf("?") + 1).split("&");
				            // 以修改方式重定向该页面
				            var sNewURL = sCurrURL + "?mode=2&oid=" + myEscape(sOid);
				            for (var i = 0; i < arrURLParams.length; i++) {
				                if (arrURLParams[i].toLowerCase().indexOf("mode=") != 0 && arrURLParams[i].toLowerCase().indexOf("oid=") != 0
						            && arrURLParams[i].toLowerCase().indexOf("isnewprocess=") < 0)
				                    sNewURL += "&" + arrURLParams[i];
				            }
				            //增加需要发起审批参数
				            sNewURL += "&IsNewProcess=" + sNewProcess;
				            window.navigate(escapeUrl(sNewURL));
				            appForm._bAlert = false;
				            event.returnValue = false;
				            return;

				            if (document.all("__IsNewProcess")) {

				                window.navigate(escapeUrl(document.URL.replace("IsNewProcess=", "IsNewProcessDel=")));

				    window.opener.GetDTCBMsg();
				}

			//功能：保存前数据校验
			function ValidData()
			{
				// 金额不能为零
				if (stringToFloat(appForm.ApplyAmount.getValue()) == 0 )
				{
					alert("上报金额不允许为零！");
					return false;
				}
				var decYcfAmount = stringToFloat(appForm.YcfAmount.getValue());			// 已拆分金额
				var decScheduleAmount = stringToFloat(appForm.ScheduleAmount.getValue());	// 应付进度款
				//修改模式下，需要比较已拆分金额与应付进度款
				if (Form1.txtCfMode.value == "手动拆分" && __mode.value=="2" )	
				{
					if (decYcfAmount > 0 && decScheduleAmount < decYcfAmount)
					{
						alert("应付进度款不允许小于已拆分金额： " + decYcfAmount.toLocaleString() + "！");
						return false ;
					}
					if (decYcfAmount < 0 && decScheduleAmount > decYcfAmount)
					{
						alert("应付进度款不允许大于已拆分金额：" + decYcfAmount.toLocaleString() + "！");
						return false;
					}
				}
				if (appForm.oid.value) {
				    var strFile = "/Cbgl/HTFK/HTFK_XMLHTTP.aspx?oid=" + appForm.oid.value;
				    var strRtn = openXMLHTTP(strFile, "ValidScheduleState");
				    if (strRtn != "FAIL") {
				        if (appForm.ApproveState.value != strRtn) {
				            alert("当前应付进度款审核状态与数据库不一致，不允许保存！");
				            return false;
				        }
				        return true;
				    } else {
				        alert("获取应付进度款审核状态失败！");
				        return false;
				    }
				}
			}

			function afterWorkflow() {
			    var SPState = HTFKPlan_Schedule_Edit.GetSpState();
			    if (SPState == "未审核") {
			        window.navigate(escapeUrl(document.URL.replace("mode=3", "mode=2").replace("IsNewProcess", "ss").replace(myEscape("查看应付进度款"), myEscape("修改应付进度款"))));
			    } else if (SPState == "审核中") {
			        window.navigate(escapeUrl(document.URL.replace("IsNewProcess", "ss").replace(myEscape("修改应付进度款"), myEscape("查看应付进度款"))));

			}
			// 合同并发控制对象
			var scheduleConccurency = new (function() {
			    var _resIdentify, _me = this, _lockInfo, _timeout;
			    var 
                _lockContract = function(contractGUID) {
                    /// <summary>锁定合同</summary>
                    try {
                        // 没有合约规划，所以不需要锁合约规划
                        _resIdentify = Conccurency.Contract.LockContract(contractGUID, { resIdentify: _resIdentify, lockInfo: _lockInfo, timeout: _timeout });
                    }
                    catch (ex) {
                        switch (ex.type) {
                            case "CONFLICT":
                                alert("当前应付进度款对应的合同或相关数据已被用户【" + ex.userName + "】在【" + ex.module + "】模块锁定！");
                                break;
                            case "NETTIMEOVER":
                                alert("网络连接超时，请重新登录！");
                                break;
                            default:
                                alert("操作失败，请关闭重试！");
                                break;
                        }
                        return false;
                    }
                    return true;
                };
			    this.lockData = function(timeout, lockInfo) {
			        /// <summary>在保存或审批时锁定数据,合同GUID从appForm.ContractGUID.value中获取</summary>
			        /// <returns type="Boolean" />
			        _lockInfo = lockInfo;
			        _timeout = timeout;
			        if (Form1.txtDoneMode.value == "CHECK") {
			            if (!_lockContract(appForm.ContractGUID.value)) {
			                return false;
			            }
			        }
			        return true;
			    };
			    this.release = function() {
			        /// <summary>释放锁</summary>
			        if (_resIdentify) {
			            try { Conccurency.Contract.UnLock(_resIdentify); _resIdentify = null; } catch (ex) { alert("释放资源失败，如果继续操作，请等待" + (_timeout / 60) + "分钟！") }
			        }
			    }
			    window.attachEvent("onbeforeunload", _me.release);
			})();
